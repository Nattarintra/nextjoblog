name: Playwright E2E

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjoblog

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjoblog/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

  e2e-tests:
    # This Ubuntu workflow is the authoritative E2E runner. The development
    # Mac is capped at macOS 13 and cannot run this project's Playwright Chromium.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjoblog

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjoblog/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # The short-timebox project relies on current auth configuration
          # support (notably auth.jwt_expiry) to force a refresh after its
          # 30-second session timebox.
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset test database
        run: supabase db reset

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nextjoblog/playwright-report/
          retention-days: 14
